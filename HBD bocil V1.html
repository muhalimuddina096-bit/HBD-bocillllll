<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Birthday Gift</title>
    <style>
        :root {
            --bg-color: #0b0118;
            --container-bg: rgba(255, 255, 255, 0.08);
            --accent: #ff758c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #1e033d 0%, #0b0118 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 85%;
            max-width: 350px;
            background: var(--container-bg);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 1.2rem; margin-bottom: 10px; }
        p { font-size: 0.9rem; color: #ddd; line-height: 1.5; }

        /* Game Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 20px 0;
        }

        .card {
            aspect-ratio: 1/1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .card.flipped { background: var(--accent); }
        .card span { visibility: hidden; }
        .card.flipped span { visibility: visible; }

        /* Tiup Lilin Section */
        .cake { font-size: 4rem; margin: 20px 0; position: relative; }
        .flame {
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            animation: flicker 0.2s infinite alternate;
        }
        @keyframes flicker { from { opacity: 0.8; } to { opacity: 1; scale: 1.1; } }

        /* Button */
        button {
            background: var(--accent);
            border: none;
            padding: 12px 25px;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover { scale: 1.05; box
