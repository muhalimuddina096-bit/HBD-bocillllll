<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Birthday Gift</title>
    <style>
        :root {
            --bg-color: #0b0118;
            --container-bg: rgba(255, 255, 255, 0.08);
            --accent: #ff758c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #1e033d 0%, #0b0118 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 85%;
            max-width: 350px;
            background: var(--container-bg);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 1.2rem; margin-bottom: 10px; }
        p { font-size: 0.9rem; color: #ddd; line-height: 1.5; }

        /* Game Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 20px 0;
        }

        .card {
            aspect-ratio: 1/1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .card.flipped { background: var(--accent); }
        .card span { visibility: hidden; }
        .card.flipped span { visibility: visible; }

        /* Tiup Lilin Section */
        .cake { font-size: 4rem; margin: 20px 0; position: relative; }
        .flame {
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            animation: flicker 0.2s infinite alternate;
        }
        @keyframes flicker { from { opacity: 0.8; } to { opacity: 1; scale: 1.1; } }

        /* Button */
        button {
            background: var(--accent);
            border: none;
            padding: 12px 25px;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover { scale: 1.05; box-shadow: 0 0 15px var(--accent); }

        .hidden { display: none; }

        /* Typewriter text */
        #wishText { text-align: left; white-space: pre-wrap; margin-top: 15px; min-height: 100px; }
    </style>
</head>
<body>

    <div id="sec1" class="container">
        <h2>A Little Game for You 🎁</h2>
        <p>Balik 2 Kartu yang Sama!</p>
        <div class="grid" id="gameGrid"></div>
    </div>

    <div id="sec2" class="container hidden">
        <h2>Make a Wish 🕯️</h2>
        <p>Tutup matamu, buat permintaan, lalu tiup lilinnya sayangku!</p>
        <div class="cake">
            <span class="flame" id="flame">🔥</span>
            🎂
        </div>
        <button id="btnBlow" onclick="blowCandle()">Tiup Lilin</button>
    </div>

    <div id="sec3" class="container hidden">
        <div style="font-size: 2.5rem; margin-bottom: 10px;">🐼🐻</div>
        <h2 style="color: var(--accent);">Happy Birthday sayangku! 🥳</h2>
        <div id="wishText"></div>
        <button onclick="location.reload()" style="margin-top: 30px; opacity: 0.6; font-size: 0.7rem;">Main Lagi</button>
    </div>

    <script>
        const emojis = ['🌸', '🌸', '💖', '💖', '🎁', '🎁', '⭐', '⭐', '🎈', '🎈', '🍭', '🍭', '🌈', '🌈', '🦋', '🦋'];
        let shuffled = emojis.sort(() => Math.random() - 0.5);
        let flipped = [];
        let matches = 0;

        // Initialize Game
        const grid = document.getElementById('gameGrid');
        shuffled.forEach(emoji => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<span>${emoji}</span>`;
            card.onclick = () => {
                if(card.classList.contains('flipped') || flipped.length === 2) return;
                card.classList.add('flipped');
                flipped.push(card);
                if(flipped.length === 2) {
                    if(flipped[0].innerText === flipped[1].innerText) {
                        matches++;
                        flipped = [];
                        if(matches === 8) setTimeout(() => transition(1, 2), 1000);
                    } else {
                        setTimeout(() => {
                            flipped.forEach(c => c.classList.remove('flipped'));
                            flipped = [];
                        }, 700);
                    }
                }
            };
            grid.appendChild(card);
        });

        function transition(from, to) {
            document.getElementById('sec' + from).classList.add('hidden');
            document.getElementById('sec' + to).classList.remove('hidden');
        }

        function blowCandle() {
            document.getElementById('flame').style.display = 'none';
            document.getElementById('btnBlow').innerText = 'Sudah Ditiup!';
            setTimeout(() => transition(2, 3), 1500);
            setTimeout(startTyping, 2000);
        }

        function startTyping() {
            const text = "Selamat Ulang Tahun Bocilllllll🥳🥳🥳, Semoga di ulang tahun kali ini kamu heppy ya adeeeeek, semoga dengan bertambah nya ummur adek bertambah juga rasa syukur nya, semangant buat kuliah nya semangant buat jalanin hari hari nya, diberi kesehatan kalo ada apa apa bilang ya kemas ya cerita jangan diem aja ya sayang ya😚😚😚, SELAMAT ULANG TAHUN BOCILLLLLLLLL🥳🥳🥳";
            let i = 0;
            const target = document.getElementById('wishText');
            
            function type() {
                if (i < text.length) {
                    target.innerHTML += text.charAt(i);
                    i++;
                    // Scroll ke bawah otomatis saat mengetik
                    window.scrollTo(0, document.body.scrollHeight);
                    setTimeout(type, 40);
                }
            }
            type();
        }
    </script>
</body>
</html>
