<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Birthday Gift 🎁</title>
    <style>
        :root {
            --bg-color: #0b0118;
            --container-bg: rgba(255, 255, 255, 0.08);
            --accent: #ff758c;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #1e033d 0%, #0b0118 100%);
            color: white;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        .container {
            width: 85%; max-width: 350px;
            background: var(--container-bg);
            backdrop-filter: blur(15px);
            border-radius: 20px; padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center; animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 1.2rem; margin-bottom: 10px; color: var(--accent); }
        p { font-size: 0.9rem; color: #ddd; }

        /* Game Grid */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 20px 0; }
        .card { 
            aspect-ratio: 1/1; background: rgba(255, 255, 255, 0.2); 
            border-radius: 8px; display: flex; align-items: center; 
            justify-content: center; font-size: 1.5rem; cursor: pointer; transition: 0.3s; 
        }
        .card.flipped { background: var(--accent); }
        .card span { visibility: hidden; }
        .card.flipped span { visibility: visible; }

        /* Tiup Lilin */
        .cake { font-size: 4rem; margin: 20px 0; position: relative; }
        .flame { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); animation: flicker 0.2s infinite alternate; }
        @keyframes flicker { from { opacity: 0.8; } to { opacity: 1; transform: translateX(-50%) scale(1.1); } }

        /* Tombol Section */
        .btn-group { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            margin-top: 20px; 
            min-height: 50px;
            position: relative;
        }
        
        button {
            background: var(--accent); border: none; padding: 10px 25px;
            color: white; border-radius: 25px; cursor: pointer;
            font-weight: bold; transition: background 0.3s;
        }

        /* EFEK LARI HALUS */
        #btnTidak { 
            background: #666; 
            transition: all 0.2s ease-out; /* Ini yang bikin dia kelihatan lari, bukan ilang */
            z-index: 999;
        }

        .hidden { display: none; }
        #wishText { text-align: left; white-space: pre-wrap; font-size: 0.85rem; line-height: 1.6; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="sec1" class="container">
        <h2>A Little Game for You 🎁</h2>
        <p>Cari pasangan kartu yang sama ya!</p>
        <div class="grid" id="gameGrid"></div>
    </div>

    <div id="sec2" class="container hidden">
        <h2>Make a Wish 🕯️</h2>
        <p>Tutup mata, buat permintaan, lalu tiup!</p>
        <div class="cake">
            <span class="flame" id="flame">🔥</span>
            🎂
        </div>
        <button onclick="blowCandle()">Tiup Lilin</button>
    </div>

    <div id="sec3" class="container hidden">
        <h2 style="margin-bottom: 20px;">HBD Sayangggggggggg ❤️</h2>
        <p>Kamu happy atau nggak hari ini?</p>
        <div class="btn-group">
            <button id="btnIya" onclick="showFinal()">Iya ❤️</button>
            <button id="btnTidak" onmouseover="lariLarian()" onclick="lariLarian()">Tidak</button>
        </div>
    </div>

    <div id="sec4" class="container hidden">
        <h2>Happy Birthday! 🥳</h2>
        <div id="wishText"></div>
        <button onclick="location.reload()" style="margin-top: 20px; font-size: 0.7rem; opacity: 0.5;">Main Lagi</button>
    </div>

    <script>
        // Logika Game & Transition (Sama)
        const emojis = ['🌸', '🌸', '💖', '💖', '🎁', '🎁', '⭐', '⭐', '🎈', '🎈', '🍭', '🍭', '🌈', '🌈', '🦋', '🦋'];
        let shuffled = emojis.sort(() => Math.random() - 0.5);
        let flipped = [];
        let matches = 0;
        const grid = document.getElementById('gameGrid');
        shuffled.forEach(emoji => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<span>${emoji}</span>`;
            card.onclick = () => {
                if(card.classList.contains('flipped') || flipped.length === 2) return;
                card.classList.add('flipped');
                flipped.push(card);
                if(flipped.length === 2) {
                    if(flipped[0].innerText === flipped[1].innerText) {
                        matches++;
                        flipped = [];
                        if(matches === 8) setTimeout(() => transition(1, 2), 1000);
                    } else {
                        setTimeout(() => {
                            flipped.forEach(c => c.classList.remove('flipped'));
                            flipped = [];
                        }, 700);
                    }
                }
            };
            grid.appendChild(card);
        });

        function transition(from, to) {
            document.getElementById('sec' + from).classList.add('hidden');
            document.getElementById('sec' + to).classList.remove('hidden');
        }

        function blowCandle() {
            document.getElementById('flame').classList.add('hidden');
            setTimeout(() => transition(2, 3), 1000);
        }

        // --- LOGIKA LARI-LARIAN YANG LEBIH SMOOTH ---
        function lariLarian() {
            const btn = document.getElementById('btnTidak');
            btn.style.position = 'fixed';
            
            // Jarak lari (padding) supaya nggak nempel banget ke pinggir layar
            const padding = 50;
            const maxX = window.innerWidth - btn.offsetWidth - padding;
            const maxY = window.innerHeight - btn.offsetHeight - padding;
            
            const randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding)) + padding;
            
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        function showFinal() {
            transition(3, 4);
            const text = "Kita make a wish di hari ulang tahunmu ini yaa 🥺 Semoga kamu selalu diberi kesehatan, hati yang tenang, dan kebahagiaan selalu menyertaimu 🫶\n\nSemangat terus kejar impianmu, aku selalu dukung kamu di sini ✨\n\nHappy Level Up Day! 💖";
            let i = 0;
            const target = document.getElementById('wishText');
            function type() {
                if (i < text.length) {
                    target.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 50);
                }
            }
            type();
        }
    </script>
</body>
</html>
