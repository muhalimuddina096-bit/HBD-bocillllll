<!DOCTYPE html>
<html lang="id">
<head>
    <!-- 
        PROJECT: Birthday Surprise for Sonya
        AUTHOR: Muhammad Alimuddin Abdullah
        VERSION: 3.0 (Final "Glow Up" Edition)
        DESCRIPTION: Simple, Aesthetic, Interactive.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HBD Sonya Sayang! ✨</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Dancing+Script:wght@700&family=Fredoka+One&display=swap" rel="stylesheet">
    
    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --primary-pink: #ff85a2;
            --soft-pink: #fff0f3;
            --deep-pink: #d63384;
            --accent-gold: #ffd700;
            --glass: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --shadow: 0 20px 50px rgba(255, 133, 162, 0.2);
            --text-main: #4a4a4a;
        }

        /* --- RESET & BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--soft-pink);
            background-image: 
                radial-gradient(at 0% 0%, hsla(343,100%,92%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(2,100%,94%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,100%,92%,1) 0, transparent 50%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            color: var(--text-main);
        }

        .hidden { display: none !important; }

        /* --- INTRO SCREEN STYLES --- */
        #intro-layer {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            cursor: pointer;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mascot-container {
            position: relative;
            margin-bottom: 30px;
        }

        .emoji-mascot {
            font-size: 5rem;
            animation: bounceMascot 2s infinite;
            display: inline-block;
        }

        @keyframes bounceMascot {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        .intro-text-wrapper {
            padding: 0 40px;
            min-height: 100px;
        }

        .intro-text {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #progress-container {
            width: 80%;
            max-width: 280px;
            height: 18px;
            background: rgba(255,255,255,0.3);
            border-radius: 20px;
            margin-top: 30px;
            padding: 3px;
            display: none;
            border: 2px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff4757, #ff6b81);
            border-radius: 15px;
            transition: width 0.15s ease-out;
        }

        /* --- MAIN CARD CONTAINER --- */
        .container {
            width: 90%;
            max-width: 380px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 50px 30px;
            text-align: center;
            position: relative;
            box-shadow: var(--shadow);
            border: 1px solid var(--glass-border);
            z-index: 10;
            animation: cardEnter 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: scale(0.7) translateY(50px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- CANDLE & CAKE STYLES --- */
        .cake-area {
            margin: 30px 0;
            position: relative;
        }

        .cake-emoji {
            font-size: 6rem;
            display: inline-block;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            animation: cakeWobble 3s infinite ease-in-out;
        }

        .candle-flame {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8rem;
            animation: flameFlicker 0.3s infinite alternate;
        }

        @keyframes flameFlicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 0.8; }
            100% { transform: translateX(-50%) scale(1.1) rotate(2deg); opacity: 1; }
        }

        @keyframes cakeWobble {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(3deg); }
            75% { transform: rotate(-3deg); }
        }

        /* --- FINAL CARD ELEMENTS --- */
        .profile-section {
            position: relative;
            margin-bottom: 25px;
        }

        .photo-frame {
            width: 140px;
            height: 140px;
            margin: -110px auto 15px;
            border-radius: 50%;
            border: 6px solid white;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(255, 133, 162, 0.4);
            position: relative;
            z-index: 2;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: var(--deep-pink);
            margin-bottom: 5px;
        }

        .full-name {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #999;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .wish-display {
            background: white;
            border-radius: 25px;
            padding: 25px;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid #f0f0f0;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
            transition: all 0.3s;
            position: relative;
        }

        .wish-display:active { transform: scale(0.97); }

        #wish-text {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-main);
            transition: opacity 0.3s;
        }

        /* --- NAVIGATION DOTS --- */
        .dots-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .dot {
            height: 10px;
            width: 10px;
            background: #e0e0e0;
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dot.active {
            width: 25px;
            border-radius: 10px;
            background: var(--primary-pink);
        }

        /* --- INTERACTIVE BUTTONS --- */
        .action-btn {
            background: linear-gradient(45deg, var(--primary-pink), #ff6b81);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 107, 129, 0.3);
            transition: all 0.3s;
            margin-top: 20px;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(255, 107, 129, 0.4);
        }

        /* --- DECORATIONS --- */
        .floating-heart {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0) rotate(0); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        canvas#confetti-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }

        .shake-element {
            animation: shakeAni 0.1s infinite;
        }

        @keyframes shakeAni {
            0%, 100% { transform: translate(0,0); }
            25% { transform: translate(2px, 2px); }
            75% { transform: translate(-2px, -2px); }
        }
    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="hbd-music" loop>
        <source src="./HBD_BOCILLLLLLL.mp3" type="audio/mpeg">
    </audio>

    <!-- LAYER 1: INTRO -->
    <div id="intro-layer" onclick="processIntroTap()">
        <div class="mascot-container">
            <div class="emoji-mascot" id="main-emoji">🎁</div>
        </div>
        <div class="intro-text-wrapper">
            <div id="intro-msg" class="intro-text">Halo Sonya Sayang! <br> Ketuk untuk mulai ✨</div>
        </div>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <!-- LAYER 2: CANDLE -->
    <div id="sec-candle" class="container hidden">
        <h2 style="font-family: 'Fredoka One'; color: var(--primary-pink); font-size: 1.8rem;">Make a Wish ✨</h2>
        <p style="font-size: 0.85rem; color: #888; margin-top: 10px;">Pejamkan mata, minta doa yang terbaik ya...</p>
        
        <div class="cake-area">
            <span class="candle-flame" id="main-flame">🔥</span>
            <span class="cake-emoji">🎂</span>
        </div>
        
        <button class="action-btn" onclick="executeBlow()">Tiup Lilinnya!</button>
    </div>

    <!-- LAYER 3: FINAL CARD -->
    <div id="sec-final" class="container hidden">
        <div class="profile-section">
            <div class="photo-frame">
                <img src="./ADEEEEEEEK.jpeg" alt="Sonya">
            </div>
            <h1 class="name-title">Happy Birthday!</h1>
            <p class="full-name">Sonya Mei Kodista</p>
        </div>
        
        <div class="wish-display" onclick="cycleWishes()">
            <div id="wish-text"></div>
        </div>
        
        <div class="dots-container" id="nav-dots"></div>
        
        <p style="margin-top: 20px; font-size: 0.7rem; color: #bbb;">
            Ketuk pada kotak pesan untuk melihat lainnya ✨
        </p>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <!-- SCRIPTS -->
    <script>
        /* --- CONFIGURATION --- */
        const CONFIG = {
            introSteps: [
                { msg: "Halo Sayangku... ✨", emoji: "🌸" },
                { msg: "Cie ada yang makin tua nih.. 😜", emoji: "🎈" },
                { msg: "Bercanda kok, makin cantik banget! 💖", emoji: "🥰" },
                { msg: "Mas punya kejutan kecil buat kamu.", emoji: "✨" },
                { msg: "Siap?", emoji: "🚀" },
                { msg: "3...", emoji: "🔥" },
                { msg: "2...", emoji: "⚡" },
                { msg: "1...", emoji: "🎉" },
                { msg: "TAP CEPAT DI SINI SAYANG!! 🔥", emoji: "❤️" }
            ],
            wishes: [
                "Selamat ulang tahun yang ke-20 ehh ke-17 buat Bocil kesayangan Mas! Semoga panjang umur, sehat selalu, dan makin pinter kuliahnya! 🎂",
                "Mas minta maaf ya belum bisa kasih kado fisik hari ini. Tapi tenang, nanti kita jalan-jalan yaaaaa! 😘",
                "Moga-moga kamu jadi pribadi yang lebih baik dan makin dewasa. Ingat, semangat kuliahnya jangan males-males ya Sayang! ❤️"
            ],
            maxTaps: 20,
            particleRate: 400
        };

        /* --- STATE MANAGEMENT --- */
        let state = {
            introIdx: 0,
            taps: 0,
            isTapMode: false,
            audioInit: false,
            currentWish: 0
        };

        const elements = {
            intro: document.getElementById('intro-layer'),
            text: document.getElementById('intro-msg'),
            emoji: document.getElementById('main-emoji'),
            progress: document.getElementById('progress-container'),
            bar: document.getElementById('progress-bar'),
            music: document.getElementById('hbd-music'),
            wishDisplay: document.getElementById('wish-text'),
            dots: document.getElementById('nav-dots')
        };

        /* --- INTRO LOGIC --- */
        function processIntroTap() {
            // Unblock audio on first interaction
            if (!state.audioInit) {
                elements.music.play().then(() => {
                    elements.music.pause();
                    elements.music.currentTime = 0;
                });
                state.audioInit = true;
            }

            if (!state.isTapMode) {
                if (state.introIdx < CONFIG.introSteps.length) {
                    const step = CONFIG.introSteps[state.introIdx];
                    elements.text.innerHTML = step.msg;
                    elements.emoji.innerText = step.emoji;
                    state.introIdx++;
                    
                    if (state.introIdx === CONFIG.introSteps.length) {
                        state.isTapMode = true;
                        elements.progress.style.display = 'block';
                    }
                }
            } else {
                state.taps++;
                const progress = (state.taps / CONFIG.maxTaps) * 100;
                elements.bar.style.width = `${progress}%`;
                
                // Shake effect
                elements.intro.classList.add('shake-element');
                setTimeout(() => elements.intro.classList.remove('shake-element'), 50);

                if (state.taps >= CONFIG.maxTaps) {
                    elements.intro.style.opacity = '0';
                    elements.intro.style.transform = 'scale(1.2)';
                    setTimeout(() => {
                        elements.intro.style.display = 'none';
                        document.getElementById('sec-candle').classList.remove('hidden');
                    }, 800);
                }
            }
        }

        /* --- CANDLE LOGIC --- */
        function executeBlow() {
            const flame = document.getElementById('main-flame');
            flame.style.transition = 'all 0.5s';
            flame.style.opacity = '0';
            flame.style.transform = 'translate(-50%, -20px) scale(0)';
            
            elements.music.play();
            
            setTimeout(() => {
                document.getElementById('sec-candle').classList.add('hidden');
                document.getElementById('sec-final').classList.remove('hidden');
                initConfetti();
                startFloatingHearts();
                cycleWishes(); // Show first wish
            }, 1000);
        }

        /* --- WISH SLIDER LOGIC --- */
        function cycleWishes() {
            elements.wishDisplay.style.opacity = '0';
            
            setTimeout(() => {
                elements.wishDisplay.innerHTML = CONFIG.wishes[state.currentWish];
                elements.wishDisplay.style.opacity = '1';
                
                // Render Dots
                elements.dots.innerHTML = '';
                CONFIG.wishes.forEach((_, i) => {
                    const d = document.createElement('div');
                    d.className = `dot ${i === state.currentWish ? 'active' : ''}`;
                    elements.dots.appendChild(d);
                });
                
                state.currentWish = (state.currentWish + 1) % CONFIG.wishes.length;
            }, 300);
        }

        /* --- VISUAL EFFECTS --- */
        function startFloatingHearts() {
            const symbols = ['❤️', '💖', '✨', '🌸', '🍰', '🥰'];
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                const size = Math.random() * 20 + 15;
                heart.style.fontSize = size + 'px';
                const duration = Math.random() * 3 + 4;
                heart.style.animationDuration = duration + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), duration * 1000);
            }, CONFIG.particleRate);
        }

        function initConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            const colors = ['#ff85a2', '#ff6b81', '#ffd700', '#6bc1ff', '#ffffff'];

            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 7 + 3,
                    speed: Math.random() * 3 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    angle: Math.random() * 6.28
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    p.y += p.speed;
                    p.x += Math.sin(p.angle) * 1;
                    if (p.y > canvas.height) p.y = -20;
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        // Handle window resize for canvas
        window.onresize = () => {
            const canvas = document.getElementById('confetti-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
    </script>
</body>
</html>
